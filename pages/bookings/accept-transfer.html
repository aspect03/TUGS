<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imajination — Accept Ticket Transfer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/system-dialogs.js"></script>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex flex-col items-center justify-center px-4" style="font-family:'Montserrat',sans-serif;">
  <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,rgba(239,68,68,0.07),transparent_60%)] pointer-events-none"></div>

  <div id="loadingState" class="flex flex-col items-center gap-4 text-white/50">
    <div class="w-10 h-10 rounded-full border-2 border-red-500/40 border-t-red-400 animate-spin"></div>
    <p class="text-sm uppercase tracking-wider">Loading transfer details…</p>
  </div>

  <div id="transferCard" class="hidden w-full max-w-md">
    <div class="text-center mb-8">
      <span class="inline-flex w-16 h-16 rounded-2xl bg-purple-500/15 border border-purple-500/25 items-center justify-center mb-4">
        <i data-lucide="send" class="w-7 h-7 text-purple-400"></i>
      </span>
      <h1 class="text-2xl font-extrabold text-white">Ticket Transfer</h1>
      <p class="text-sm text-white/50 mt-1">Someone has sent you a ticket</p>
    </div>

    <div class="bg-neutral-900/80 border border-white/[0.08] rounded-2xl p-6 space-y-4 mb-5 backdrop-blur">
      <div>
        <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/35 mb-1">Event</p>
        <p id="trEventTitle" class="text-lg font-extrabold text-white"></p>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/35 mb-1">Date</p>
          <p id="trEventDate" class="text-sm font-semibold text-white"></p>
        </div>
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/35 mb-1">Venue</p>
          <p id="trVenue" class="text-sm font-semibold text-white"></p>
        </div>
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/35 mb-1">Tier</p>
          <p id="trTier" class="text-sm font-semibold text-white"></p>
        </div>
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/35 mb-1">Quantity</p>
          <p id="trQty" class="text-sm font-semibold text-white"></p>
        </div>
      </div>
      <div class="pt-3 border-t border-white/[0.06]">
        <p class="text-[10px] text-white/35 uppercase tracking-wider">Transferred by</p>
        <p id="trFrom" class="text-sm font-bold text-white mt-0.5"></p>
        <p id="trExpiry" class="text-[11px] text-amber-400/80 mt-1"></p>
      </div>
    </div>

    <div id="actionArea">
      <div id="signInPrompt" class="hidden rounded-2xl border border-white/[0.08] bg-white/[0.03] p-5 text-center mb-4">
        <p class="text-sm text-white/60 mb-4">Sign in to accept this ticket transfer.</p>
        <a id="signInLink" href="#" class="inline-block px-6 py-3 bg-red-600 text-white text-xs font-bold uppercase tracking-wider rounded-xl hover:bg-red-500 transition-colors">Sign In / Sign Up</a>
      </div>
      <button id="acceptBtn" class="hidden w-full py-4 bg-purple-600 text-white text-sm font-bold uppercase tracking-wider rounded-2xl hover:bg-purple-500 transition-colors shadow-[0_10px_30px_-10px_rgba(168,85,247,0.5)]">
        Accept Ticket
      </button>
      <p id="statusMsg" class="hidden text-center text-sm font-semibold mt-4"></p>
    </div>
  </div>

  <div id="errorState" class="hidden text-center max-w-sm">
    <div class="w-16 h-16 rounded-2xl bg-red-500/15 border border-red-500/25 flex items-center justify-center mx-auto mb-5">
      <i data-lucide="alert-triangle" class="w-7 h-7 text-red-400"></i>
    </div>
    <h2 class="text-xl font-bold text-white mb-2">Transfer Not Available</h2>
    <p id="errorMsg" class="text-sm text-white/50"></p>
    <a href="/" class="mt-6 inline-block px-5 py-3 bg-white/[0.06] border border-white/[0.08] text-white text-xs font-bold uppercase tracking-wider rounded-xl hover:bg-white/10 transition-colors">Go Home</a>
  </div>

  <script>
    lucide.createIcons();
    const token = new URLSearchParams(window.location.search).get('token');
    const userId = localStorage.getItem('userId');

    function showError(msg) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('transferCard').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMsg').innerText = msg;
      lucide.createIcons();
    }

    async function loadTransfer() {
      if (!token) { showError('No transfer token provided.'); return; }
      try {
        const res = await fetch(`/api/ticket-transfer/preview/${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok) { showError(data.message || 'Transfer not available.'); return; }

        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('trEventTitle').innerText = data.eventTitle || 'Event';
        document.getElementById('trEventDate').innerText = data.eventDate
          ? new Date(data.eventDate).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' })
          : 'TBA';
        document.getElementById('trVenue').innerText = [data.location, data.city].filter(Boolean).join(', ') || 'TBA';
        document.getElementById('trTier').innerText = data.tierName || 'General Admission';
        document.getElementById('trQty').innerText = data.quantity === 1 ? '1 Ticket' : `${data.quantity} Tickets`;
        document.getElementById('trFrom').innerText = data.fromName || 'Unknown sender';
        document.getElementById('trExpiry').innerText = `Link expires ${new Date(data.expiresAt).toLocaleString('en-PH')}`;

        document.getElementById('transferCard').classList.remove('hidden');

        if (!userId) {
          document.getElementById('signInPrompt').classList.remove('hidden');
          const redir = encodeURIComponent(window.location.href);
          document.getElementById('signInLink').href = `/pages/auth/login.html?redirect=${redir}`;
        } else {
          document.getElementById('acceptBtn').classList.remove('hidden');
          document.getElementById('acceptBtn').addEventListener('click', acceptTransfer);
        }
        lucide.createIcons();
      } catch(e) {
        showError('Failed to load transfer details. Please try again.');
      }
    }

    async function acceptTransfer() {
      const btn = document.getElementById('acceptBtn');
      const statusMsg = document.getElementById('statusMsg');
      btn.disabled = true;
      btn.innerText = 'Accepting…';
      try {
        const res = await fetch(`/api/ticket-transfer/accept/${encodeURIComponent(token)}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        btn.classList.add('hidden');
        statusMsg.innerText = '✓ ' + (data.message || 'Ticket accepted!');
        statusMsg.className = 'text-center text-sm font-semibold mt-4 text-emerald-400';
        statusMsg.classList.remove('hidden');
        setTimeout(() => { window.location.href = '/pages/dashboards/CustomerDashboard.html'; }, 2500);
      } catch(err) {
        statusMsg.innerText = err.message || 'Failed to accept transfer.';
        statusMsg.className = 'text-center text-sm font-semibold mt-4 text-red-400';
        statusMsg.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'Accept Ticket';
      }
    }

    loadTransfer();
  </script>
</body>
</html>
